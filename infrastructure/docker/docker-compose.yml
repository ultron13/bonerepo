name: plimsoll

services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    environment:
      POSTGRES_DB: plimsoll
      POSTGRES_PASSWORD: postgres_dev
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plimsoll"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: plimsoll
      MINIO_ROOT_PASSWORD: plimsoll_dev_secret
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      PLIMSOLL_DATABASE_URL: postgresql+asyncpg://plimsoll_app:plimsoll_app_dev@postgres:5432/plimsoll
      PLIMSOLL_MIGRATION_DATABASE_URL: postgresql+asyncpg://plimsoll_owner:plimsoll_owner_dev@postgres:5432/plimsoll
      PLIMSOLL_REDIS_URL: redis://redis:6379/0
      PLIMSOLL_S3_ENDPOINT: http://minio:9000
      PLIMSOLL_S3_ACCESS_KEY: plimsoll
      PLIMSOLL_S3_SECRET_KEY: plimsoll_dev_secret
      PLIMSOLL_S3_BUCKET: plimsoll-artifacts
      # SigV4 signs the Host header, so a link that leaves the compose network
      # must be signed for the name its user will resolve. Browsers and host
      # tests reach the published port; agents inside the network do not.
      PLIMSOLL_S3_PUBLIC_ENDPOINT: http://localhost:9000
      PLIMSOLL_JWT_SECRET: development-only-secret-change-me
      # 32 bytes, base64url. Development only; a deployment generates its own.
      PLIMSOLL_CREDENTIAL_KEY: ZGV2ZWxvcG1lbnQtb25seS1rZXktMzItYnl0ZXMhISE=
      PLIMSOLL_ENVIRONMENT: development
      # The provider fixture is a container on a private network with no
      # certificate. A deployment leaves this off and uses https.
      PLIMSOLL_OIDC_ALLOW_INSECURE_ISSUER: "true"
      PLIMSOLL_CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      script-fixture: {condition: service_healthy}
      idp-fixture: {condition: service_healthy}

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["uv", "run", "python", "-m", "plimsoll_worker"]
    # The socket is owned by root:docker, and the image's uid 10001 is in
    # neither. Development only: the host's docker group id is not portable, and
    # a deployment runs on Kubernetes, where the worker holds an API token
    # instead of a socket and this override does not exist.
    user: "0:0"
    environment:
      PLIMSOLL_DATABASE_URL: postgresql+asyncpg://plimsoll_app:plimsoll_app_dev@postgres:5432/plimsoll
      PLIMSOLL_MIGRATION_DATABASE_URL: postgresql+asyncpg://plimsoll_owner:plimsoll_owner_dev@postgres:5432/plimsoll
      PLIMSOLL_REDIS_URL: redis://redis:6379/0
      PLIMSOLL_S3_ENDPOINT: http://minio:9000
      PLIMSOLL_S3_ACCESS_KEY: plimsoll
      PLIMSOLL_S3_SECRET_KEY: plimsoll_dev_secret
      PLIMSOLL_S3_BUCKET: plimsoll-artifacts
      # SigV4 signs the Host header, so a link that leaves the compose network
      # must be signed for the name its user will resolve. Browsers and host
      # tests reach the published port; agents inside the network do not.
      PLIMSOLL_S3_PUBLIC_ENDPOINT: http://localhost:9000
      PLIMSOLL_JWT_SECRET: development-only-secret-change-me
      PLIMSOLL_CREDENTIAL_KEY: ZGV2ZWxvcG1lbnQtb25seS1rZXktMzItYnl0ZXMhISE=
      PLIMSOLL_ENVIRONMENT: development
      PLIMSOLL_INTERNAL_API_URL: http://api:8000
      PLIMSOLL_GENERATOR_NETWORK: plimsoll_default
    # Metrics and liveness. The worker serves nothing else, which is precisely
    # why it needs this: without it nothing outside can tell a working worker
    # from a wedged one.
    ports: ["9100:9100"]
    volumes:
      # Root-equivalent on the host, and mounted here and nowhere else: this is
      # the only process that creates containers.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        # The browser reaches the API on the published port, not the compose
        # network name, because it resolves names on the host.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_started}

  script-fixture:
    build:
      context: ../..
      dockerfile: infrastructure/docker/script-fixture.Dockerfile
    ports: ["8081:80"]
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 and localhost resolves
      # to ::1 first, which would fail a healthy container.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/public/plans.git/info/refs?service=git-upload-pack"]
      interval: 3s
      retries: 20

  idp-fixture:
    build:
      context: ../..
      dockerfile: infrastructure/docker/idp-fixture.Dockerfile
    environment:
      # The issuer has to be the name the API resolves, because it is both the
      # trust anchor and the host discovery is fetched from.
      IDP_ISSUER: http://idp-fixture
    ports: ["8082:80"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/jwks')"]
      interval: 3s
      retries: 20

  generator-image:
    image: ghcr.io/ultron13/generator:dev
    build:
      context: ../..
      dockerfile: infrastructure/docker/generator.Dockerfile
    # Never started: generators are created per run by the worker. This entry
    # exists so `make dev` builds the image on a clean machine.
    profiles: ["images"]

  demo-target:
    build:
      context: ../..
      dockerfile: infrastructure/docker/demo-target.Dockerfile
    ports: ["8080:8080"]

volumes:
  pgdata:
