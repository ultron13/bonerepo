apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "plimsoll.labels" . | nindent 4 }}
---
# Scoped to the generator namespace and to pods. The worker creates and
# removes load generators; it has no reason to read secrets, and a Role rather
# than a ClusterRole is what stops a mistake here from being cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-generators
  namespace: {{ .Values.generators.namespace }}
  labels:
    {{- include "plimsoll.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-generators
  namespace: {{ .Values.generators.namespace }}
  labels:
    {{- include "plimsoll.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-generators
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-worker
    namespace: {{ .Release.Namespace }}
