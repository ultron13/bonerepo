[project]
name = "plimsoll-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "plimsoll-contracts",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plimsoll_api"]
