[project]
name = "plimsoll-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "plimsoll-contracts",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=43.0",
    "defusedxml>=0.7",
    "pyyaml>=6.0",
    # Alembic runs synchronously, so the image needs the sync driver too.
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plimsoll_api"]
