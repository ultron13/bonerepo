[project]
name = "plimsoll-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "plimsoll-api",
    "plimsoll-contracts",
    "docker>=7.1",
    "kubernetes-asyncio>=32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plimsoll_worker"]
