[project]
name = "plimsoll"
version = "0.1.0"
requires-python = ">=3.12"
# The root pins the workspace members so that a bare `uv run` from the
# repository root can import them, and so `uv sync --no-dev` in the image
# installs the application without the test and lint toolchain.
dependencies = [
    "plimsoll-api",
    "plimsoll-contracts",
    "plimsoll-worker",
    "plimsoll-executor-sdk",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "apps/agent",
    "packages/contracts/python",
    "packages/executor-sdk",
]

[tool.uv.sources]
plimsoll-api = { workspace = true }
plimsoll-contracts = { workspace = true }
plimsoll-worker = { workspace = true }
plimsoll-agent = { workspace = true }
plimsoll-executor-sdk = { workspace = true }

[dependency-groups]
dev = [
    # The agent ships in the generator image, not in the API image, so it is
    # not one of the root's runtime dependencies. It is installed here so the
    # test run can import it; `uv sync --no-dev` leaves it out.
    "plimsoll-agent",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    # Type stubs for runtime dependencies that ship none. Dev-only: they are
    # not needed to run the application, only to check it.
    "types-defusedxml>=0.7",
    "types-boto3>=1.0",
    "types-docker>=7.2",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
    # The synchronous driver keeps the migration and isolation tests simple.
    "psycopg[binary]>=3.1",
    # The agent-channel tests speak WebSocket as a client. 14 is where
    # additional_headers and InvalidStatus replaced the legacy client.
    "websockets>=14",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff formats Python code blocks inside Markdown. The specification and plans
# are authored prose; they are not build inputs and must not be rewritten.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = [
    "plimsoll_api",
    "plimsoll_contracts",
    "plimsoll_worker",
    "plimsoll_agent",
    "plimsoll_executor",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# The plugin knows a BaseSettings subclass is populated from the environment,
# so `Settings()` with no arguments type-checks.
plugins = ["pydantic.mypy"]
# The demo target is a standalone single-file service outside the workspace;
# its test reaches it by path, so mypy needs the same directory.
mypy_path = ["images/demo-target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "apps/api/tests",
    "apps/worker/tests",
    "apps/agent/tests",
    "packages/executor-sdk/tests",
]
markers = ["integration: requires the make dev stack"]
